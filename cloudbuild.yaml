steps:
  # 1. Build de l'image (on utilise 'latest' pour éviter l'erreur de variable vide)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/multimodal-rag-inf1900:latest'
      - '.'
    dir: 'backend'
    id: 'build-backend'

  # 2. Push vers le registre Google
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/multimodal-rag-inf1900:latest'
    id: 'push-image'

  # 3. Déploiement final sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'multimodal-rag-inf1900'
      - '--image=gcr.io/$PROJECT_ID/multimodal-rag-inf1900:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--timeout=300s'
      - '--set-env-vars=CHROMA_DB_PATH=/app/inf1900_db'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'
    id: 'deploy-backend'

images:
  - 'gcr.io/$PROJECT_ID/multimodal-rag-inf1900:latest'
